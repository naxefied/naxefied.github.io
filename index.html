<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Накси</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');

        :root {
            --font-family: 'Montserrat', sans-serif;
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #E57373;
            --accent-light: #D32F2F;
            --button-bg: #333333;
            --button-text: #E57373;
            --button-hover-bg: #E57373;
            --button-hover-text: #121212;
            --header-bg: var(--accent-light);
            --header-color: #121212;
            --footer-bg: #333333;
            --footer-color: #E57373;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: var(--text-color);
        }

        .header {
            width: 100%;
            background-color: var(--header-bg);
            color: var(--header-color);
            padding: 20px 0;
            text-align: center;
            font-size: 24px;
            position: fixed;
            top: 0;
            left: 0;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            text-align: center;
            width: 80%;
            word-wrap: break-word;
            white-space: normal;
            max-width: 90%;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: var(--footer-bg);
            color: var(--footer-color);
            text-align: center;
            padding: 10px 0;
        }

        footer a {
            color: var(--footer-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="header">Накси</div>
    <div class="content">Скоро здесь<br>что-то будет</div>
    
    <footer>
        <p><a href="https://github.com/naxefied/naxefied.github.io" target="_blank">this site on github</a></p>
        <p><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">❤️</a></p>
    </footer>
</body>
</html>
